# Example WireGuard profile. Copy this file to e.g. CH.conf and paste your
# real keys. NEVER commit real .conf files (they contain private keys) -
# they are ignored by .gitignore on purpose.
[Interface]
PrivateKey = PASTE_YOUR_PRIVATE_KEY_HERE
Address = 10.2.0.2/32
DNS = 10.2.0.1
BlockUntunneledTraffic = true

[Peer]
PublicKey = PASTE_SERVER_PUBLIC_KEY_HERE
AllowedIPs = 0.0.0.0/0
Endpoint = 192.0.2.1:51820
